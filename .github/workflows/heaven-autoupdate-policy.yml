name: Heaven AutoUpdate Contract
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heaven-autoupdate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enforce:
    name: heaven-autoupdate-enforce
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft || contains(github.event.pull_request.body, 'Draft-CI-OptIn=true'))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # This validates source metadata and file paths; it never runs the installer.
    # Public PR code stays on an ephemeral hosted runner, outside private Heaven1.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce automatic update source contract (hosted Windows)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -cne $env:EXPECTED_SHA) { throw 'SOURCE_REVISION_MISMATCH' }
          "HEAVEN_AUTOUPDATE_SOURCE_VERIFIED $actualSha"
          & ./scripts/Test-RepoUpdatePolicy.ps1
      - name: Test controller policy scalar types
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: ./scripts/Test-RepoUpdatePolicyScalars.ps1
